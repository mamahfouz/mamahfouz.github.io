<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Lineage - Mahmoud Mahfouz</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color, #ffffff);
            color: var(--text-color, #333333);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }
        
        #lineage-container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color, #ffffff);
            position: relative;
            overflow: hidden;
        }
        
        .tooltip {
            position: absolute;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.9);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            max-width: 200px;
        }
        
        .node {
            cursor: pointer;
        }
        
        .node circle {
            stroke: #fff;
            stroke-width: 2px;
            transition: r 0.3s, fill 0.3s;
        }
        
        .node text {
            font-size: 13px;
            fill: var(--text-color, #333333);
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        .link {
            stroke-opacity: 0.4;
            stroke-width: 0.5px;
            fill: none;
        }
        
        .link.highlighted {
            stroke: #FF5722;
            stroke-opacity: 1;
            stroke-width: 1px;
        }
        
        .node.highlighted circle {
            fill: #FF5722;
            r: 14;
        }
        
        .node.faded {
            opacity: 0.2;
        }
        
        .link.faded {
            opacity: 0.1;
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                --bg-color: #1a1a1a;
                --text-color: #f2f5fa;
                --text-color-secondary: #b0b0b0;
                --border-color: #404040;
            }
            
            .node text {
                fill: #f2f5fa;
            }
        }
    </style>
</head>
<body>
    <div id="lineage-container"></div>
    <div class="tooltip" id="tooltip"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
    <script>
        // Academic lineage data with descriptions and URLs
        const nodeData = {
            "Mahmoud Mahfouz": { 
                description: "Researcher in AI and machine learning",
                url: "https://scholar.google.com/citations?user=FAusNh8AAAAJ" 
            },
            "Daniele Magazzeni": { 
                description: "Professor of AI and Automated Planning",
                url: "https://scholar.google.com/citations?user=IWXDluMAAAAJ&hl=en"
            },
            "Danilo P. Mandic": { 
                description: "Professor of Signal Processing and Machine Learning",
                url: "https://scholar.google.co.uk/citations?user=hcxWZkcAAAAJ&hl=en"
            },
            "Manuela M. Veloso": { 
                description: "Professor of Computer Science, AI and Robotics researcher",
                url: "https://en.wikipedia.org/wiki/Manuela_M._Veloso"
            },
            "Sunandita Patra": { 
                description: "Researcher in AI and automated planning",
                url: "https://scholar.google.com/citations?hl=en&user=VMTRIgoAAAAJ"
            },
            "Xiaodan Zhu": { 
                description: "Researcher in natural language processing",
                url: "https://scholar.google.com/citations?hl=en&user=a6MYnuUAAAAJ"
            },
            "Adnan Darwiche": { 
                description: "Professor of Computer Science, expert in probabilistic reasoning",
                url: "https://scholar.google.com/citations?hl=en&user=NzyvbZoAAAAJ"
            },
            "Judea Pearl": { 
                description: "Computer scientist, winner of the Turing Award for causal reasoning",
                url: "https://en.wikipedia.org/wiki/Judea_Pearl"
            },
            "Anthony G. Constantinides": { 
                description: "Professor of Signal Processing",
                url: "https://en.wikipedia.org/wiki/Anthony_G._Constantinides"
            },
            "Simon Haykin": { 
                description: "Professor of Electrical Engineering, neural networks pioneer",
                url: "https://en.wikipedia.org/wiki/Simon_Haykin"
            },
            "Robert C. Berwick": { 
                description: "Professor of Computational Linguistics",
                url: "https://scholar.google.com/citations?user=7xH1C7IAAAAJ&hl=en"
            },
            "Noam Chomsky": { 
                description: "Linguist, philosopher, and cognitive scientist",
                url: "https://en.wikipedia.org/wiki/Noam_Chomsky"
            },
            "Erica Melis": { 
                description: "Professor of Computer Science, automated reasoning",
                url: null
            },
            "Christoph Benzmüller": { 
                description: "Professor of Computer Science, formal methods",
                url: null
            },
            "Dana S. Scott": { 
                description: "Mathematician and computer scientist, Turing Award winner",
                url: "https://en.wikipedia.org/wiki/Dana_Scott"
            },
            "Robin O. Gandy": { 
                description: "Mathematical logician",
                url: "https://en.wikipedia.org/wiki/Robin_Gandy"
            },
            "Alan M. Turing": { 
                description: "Mathematician, computer scientist, and cryptanalyst",
                url: "https://en.wikipedia.org/wiki/Alan_Turing"
            },
            "Michael H. Bowling": { 
                description: "Professor of Computing Science, reinforcement learning",
                url: null
            },
            "Demis Hassabis": { 
                description: "AI researcher, co-founder of DeepMind",
                url: "https://en.wikipedia.org/wiki/Demis_Hassabis"
            },
            "Peter Stone": { 
                description: "Professor of Computer Science, robotics and multi-agent systems",
                url: "https://en.wikipedia.org/wiki/Peter_Stone_(professor)"
            },
            "Barbara J. Grosz": { 
                description: "Professor of Computer Science, AI and natural language processing",
                url: "https://en.wikipedia.org/wiki/Barbara_J._Grosz"
            },
            "Marvin Minsky": { 
                description: "Cognitive scientist, co-founder of AI field",
                url: "https://en.wikipedia.org/wiki/Marvin_Minsky"
            },
            "Richard S. Sutton": { 
                description: "Computer scientist, pioneer of reinforcement learning",
                url: "https://en.wikipedia.org/wiki/Richard_S._Sutton"
            },
            "Dana S. Nau": { 
                description: "Professor of Computer Science, automated planning",
                url: "https://en.wikipedia.org/wiki/Dana_S._Nau"
            },
            "James A. Hendler": { 
                description: "Computer scientist, Semantic Web pioneer",
                url: "https://en.wikipedia.org/wiki/James_Hendler"
            },
            "Tim Berners-Lee": { 
                description: "Computer scientist, inventor of the World Wide Web",
                url: "https://en.wikipedia.org/wiki/Tim_Berners-Lee"
            },
            "Preslav Nakov": { 
                description: "Researcher in natural language processing",
                url: "https://scholar.google.com/citations?user=DfXsKZ4AAAAJ&hl=en"
            },
            "Michael A. Wooldridge": { 
                description: "Professor of Computer Science, multi-agent systems",
                url: "https://en.wikipedia.org/wiki/Michael_Wooldridge_(computer_scientist)"
            }
        };

        const nodes = [
            { id: "Mahmoud Mahfouz", group: "central" },
            { id: "Daniele Magazzeni", group: "regular" },
            { id: "Danilo P. Mandic", group: "regular" },
            { id: "Manuela M. Veloso", group: "regular" },
            { id: "Sunandita Patra", group: "regular" },
            { id: "Xiaodan Zhu", group: "regular" },
            { id: "Adnan Darwiche", group: "regular" },
            { id: "Judea Pearl", group: "legendary" },
            { id: "Anthony G. Constantinides", group: "regular" },
            { id: "Simon Haykin", group: "regular" },
            { id: "Robert C. Berwick", group: "regular" },
            { id: "Noam Chomsky", group: "legendary" },
            { id: "Erica Melis", group: "regular" },
            { id: "Christoph Benzmüller", group: "regular" },
            { id: "Dana S. Scott", group: "legendary" },
            { id: "Robin O. Gandy", group: "regular" },
            { id: "Alan M. Turing", group: "legendary" },
            { id: "Michael H. Bowling", group: "regular" },
            { id: "Demis Hassabis", group: "legendary" },
            { id: "Peter Stone", group: "regular" },
            { id: "Barbara J. Grosz", group: "regular" },
            { id: "Marvin Minsky", group: "legendary" },
            { id: "Richard S. Sutton", group: "legendary" },
            { id: "Dana S. Nau", group: "regular" },
            { id: "James A. Hendler", group: "regular" },
            { id: "Tim Berners-Lee", group: "legendary" },
            { id: "Preslav Nakov", group: "regular" },
            { id: "Michael A. Wooldridge", group: "regular" }
        ];
        
        const links = [
            { source: "Mahmoud Mahfouz", target: "Daniele Magazzeni" },
            { source: "Mahmoud Mahfouz", target: "Danilo P. Mandic" },
            { source: "Mahmoud Mahfouz", target: "Manuela M. Veloso" },
            { source: "Mahmoud Mahfouz", target: "Sunandita Patra" },
            { source: "Mahmoud Mahfouz", target: "Xiaodan Zhu" },
            { source: "Daniele Magazzeni", target: "Adnan Darwiche" },
            { source: "Adnan Darwiche", target: "Judea Pearl" },
            { source: "Danilo P. Mandic", target: "Anthony G. Constantinides" },
            { source: "Anthony G. Constantinides", target: "Simon Haykin" },
            { source: "Simon Haykin", target: "Robert C. Berwick" },
            { source: "Robert C. Berwick", target: "Noam Chomsky" },
            { source: "Manuela M. Veloso", target: "Erica Melis" },
            { source: "Erica Melis", target: "Christoph Benzmüller" },
            { source: "Christoph Benzmüller", target: "Dana S. Scott" },
            { source: "Dana S. Scott", target: "Robin O. Gandy" },
            { source: "Robin O. Gandy", target: "Alan M. Turing" },
            { source: "Manuela M. Veloso", target: "Michael H. Bowling" },
            { source: "Michael H. Bowling", target: "Demis Hassabis" },
            { source: "Manuela M. Veloso", target: "Peter Stone" },
            { source: "Peter Stone", target: "Barbara J. Grosz" },
            { source: "Barbara J. Grosz", target: "Marvin Minsky" },
            { source: "Peter Stone", target: "Richard S. Sutton" },
            { source: "Sunandita Patra", target: "Dana S. Nau" },
            { source: "Dana S. Nau", target: "James A. Hendler" },
            { source: "James A. Hendler", target: "Tim Berners-Lee" },
            { source: "Xiaodan Zhu", target: "Preslav Nakov" },
            { source: "Preslav Nakov", target: "Michael A. Wooldridge" }
        ];
        
        // Set up SVG - use container dimensions to avoid scrollbar issues
        const container = document.getElementById('lineage-container');
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const svg = d3.select("#lineage-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        const g = svg.append("g");
        
        // Tooltip
        const tooltip = d3.select("#tooltip");
        
        // Calculate hierarchical levels from Mahmoud Mahfouz
        function calculateLevels() {
            const levels = new Map();
            const queue = [["Mahmoud Mahfouz", 0]];
            levels.set("Mahmoud Mahfouz", 0);
            
            while (queue.length > 0) {
                const [current, level] = queue.shift();
                links.forEach(link => {
                    const sourceId = link.source.id || link.source;
                    const targetId = link.target.id || link.target;
                    
                    if (sourceId === current && !levels.has(targetId)) {
                        levels.set(targetId, level + 1);
                        queue.push([targetId, level + 1]);
                    } else if (targetId === current && !levels.has(sourceId)) {
                        levels.set(sourceId, level + 1);
                        queue.push([sourceId, level + 1]);
                    }
                });
            }
            
            return levels;
        }
        
        const levels = calculateLevels();
        const maxLevel = Math.max(...Array.from(levels.values()));
        
        // Color scheme based on distance from Mahmoud Mahfouz
        // Each level gets a distinct color, with furthest nodes having different colors
        const levelColors = [
            "#4CAF50",  // Level 0: Green (Mahmoud Mahfouz)
            "#2196F3",  // Level 1: Blue
            "#00BCD4",  // Level 2: Cyan
            "#FF9800",  // Level 3: Orange
            "#F44336",  // Level 4: Red
            "#9C27B0",  // Level 5: Purple
            "#673AB7",  // Level 6: Deep Purple
            "#3F51B5"   // Level 7+: Indigo
        ];
        
        function getNodeColor(level) {
            return levelColors[Math.min(level, levelColors.length - 1)] || levelColors[levelColors.length - 1];
        }
        
        // Add arrow markers for links - create one for each color
        const defs = svg.append("defs");
        levelColors.forEach((color, index) => {
            const arrowMarker = defs.append("marker")
                .attr("id", `arrowhead-${index}`)
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 15)
                .attr("refY", 0)
                .attr("markerWidth", 6)
                .attr("markerHeight", 6)
                .attr("orient", "auto");
            
            arrowMarker.append("path")
                .attr("d", "M0,-5L10,0L0,5")
                .attr("fill", color);
        });
        
        // Default arrow marker
        const defaultArrowMarker = defs.append("marker")
            .attr("id", "arrowhead-default")
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 15)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto");
        
        defaultArrowMarker.append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", "#4CAF50");
        
        // Group nodes by level
        const nodesByLevel = new Map();
        nodes.forEach(node => {
            const level = levels.get(node.id) || 0;
            if (!nodesByLevel.has(level)) {
                nodesByLevel.set(level, []);
            }
            nodesByLevel.get(level).push(node);
        });
        
        // Position nodes in horizontal layout with Mahmoud on the left
        let padding = 80;
        let columnSpacing = (width - 2 * padding) / (maxLevel + 1);
        let startX = padding;
        
        nodes.forEach(node => {
            const level = levels.get(node.id) || 0;
            const levelNodes = nodesByLevel.get(level);
            const indexInLevel = levelNodes.indexOf(node);
            const totalInLevel = levelNodes.length;
            
            // X position: based on level (column)
            node.x = startX + level * columnSpacing;
            node.fx = node.x;
            
            // Y position: distribute nodes vertically within each level
            if (totalInLevel === 1) {
                node.y = height / 2;
            } else {
                const verticalPadding = 60;
                const availableHeight = height - 2 * verticalPadding;
                const nodeSpacing = totalInLevel > 1 ? availableHeight / (totalInLevel - 1) : 0;
                node.y = verticalPadding + indexInLevel * nodeSpacing;
            }
            node.fy = node.y;
        });
        
        // No simulation - completely static layout
        
        // Create links
        const link = g.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(links)
            .enter()
            .append("line")
            .attr("class", "link")
            .attr("stroke", d => {
                const sourceId = typeof d.source === 'string' ? d.source : d.source.id;
                const source = nodes.find(n => n.id === sourceId);
                if (source) {
                    const level = levels.get(source.id) || 0;
                    return getNodeColor(level);
                }
                return "#4CAF50";
            })
            .attr("marker-end", d => {
                const sourceId = typeof d.source === 'string' ? d.source : d.source.id;
                const source = nodes.find(n => n.id === sourceId);
                if (source) {
                    const level = levels.get(source.id) || 0;
                    const colorIndex = Math.min(level, levelColors.length - 1);
                    return `url(#arrowhead-${colorIndex})`;
                }
                return "url(#arrowhead-default)";
            });
        
        // Create nodes (no drag functionality)
        const node = g.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(nodes)
            .enter()
            .append("g")
            .attr("class", d => `node ${d.group}`);
        
        node.append("circle")
            .attr("r", 10)
            .style("fill", d => {
                const level = levels.get(d.id) || 0;
                return getNodeColor(level);
            });
        
        node.append("text")
            .attr("dy", 25)
            .text(d => d.id)
            .style("font-size", "13px")
            .style("font-weight", "normal");
        
        // Add interactivity
        node.on("mouseover", function(event, d) {
            const data = nodeData[d.id] || {};
            const description = data.description || d.id;
            tooltip
                .style("opacity", 1)
                .html(`<strong>${d.id}</strong><br/>${description}`)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px");
            
            // Highlight connected nodes
            const connectedNodes = new Set([d.id]);
            links.forEach(l => {
                const sourceId = typeof l.source === 'string' ? l.source : l.source.id;
                const targetId = typeof l.target === 'string' ? l.target : l.target.id;
                if (sourceId === d.id) {
                    connectedNodes.add(targetId);
                }
                if (targetId === d.id) {
                    connectedNodes.add(sourceId);
                }
            });
            
            node.classed("faded", n => !connectedNodes.has(n.id));
            link.classed("faded", l => {
                const sourceId = typeof l.source === 'string' ? l.source : l.source.id;
                const targetId = typeof l.target === 'string' ? l.target : l.target.id;
                return !(connectedNodes.has(sourceId) && connectedNodes.has(targetId));
            });
        })
        .on("mouseout", function() {
            tooltip.style("opacity", 0);
            node.classed("faded", false);
            link.classed("faded", false);
        })
        .on("click", function(event, d) {
            const data = nodeData[d.id] || {};
            if (data.url) {
                window.open(data.url, '_blank');
            }
        });
        
        // Render static layout immediately
        function updatePositions() {
            link
                .attr("x1", d => {
                    const sourceId = typeof d.source === 'string' ? d.source : d.source.id;
                    const source = nodes.find(n => n.id === sourceId);
                    return source ? source.x : startX;
                })
                .attr("y1", d => {
                    const sourceId = typeof d.source === 'string' ? d.source : d.source.id;
                    const source = nodes.find(n => n.id === sourceId);
                    return source ? source.y : height / 2;
                })
                .attr("x2", d => {
                    const targetId = typeof d.target === 'string' ? d.target : d.target.id;
                    const target = nodes.find(n => n.id === targetId);
                    return target ? target.x : startX;
                })
                .attr("y2", d => {
                    const targetId = typeof d.target === 'string' ? d.target : d.target.id;
                    const target = nodes.find(n => n.id === targetId);
                    return target ? target.y : height / 2;
                });
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        }
        
        updatePositions();
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            svg.attr("width", newWidth).attr("height", newHeight);
            
            // Recalculate positions with new dimensions
            padding = 80;
            columnSpacing = (newWidth - 2 * padding) / (maxLevel + 1);
            startX = padding;
            
            nodes.forEach(node => {
                const level = levels.get(node.id) || 0;
                const levelNodes = nodesByLevel.get(level);
                const indexInLevel = levelNodes.indexOf(node);
                const totalInLevel = levelNodes.length;
                
                // X position: based on level (column)
                node.x = startX + level * columnSpacing;
                node.fx = node.x;
                
                // Y position: distribute nodes vertically within each level
                if (totalInLevel === 1) {
                    node.y = newHeight / 2;
                } else {
                    const verticalPadding = 60;
                    const availableHeight = newHeight - 2 * verticalPadding;
                    const nodeSpacing = totalInLevel > 1 ? availableHeight / (totalInLevel - 1) : 0;
                    node.y = verticalPadding + indexInLevel * nodeSpacing;
                }
                node.fy = node.y;
            });
            
            // Update visual positions
            updatePositions();
        });
    </script>
</body>
</html>
